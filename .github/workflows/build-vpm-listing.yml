name: Build VPM Repository Listing

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-listing:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for a published VPM package
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const source = JSON.parse(fs.readFileSync('source.json', 'utf8'));
            const manifest = JSON.parse(fs.readFileSync('UnityVPM/package.json', 'utf8'));
            let found = false;
            for (const repo of source.githubRepos) {
              const [owner, name] = repo.split('/');
              const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo: name });
              if (!releases.some(release => !release.draft)) {
                core.setFailed(`No published releases in ${repo}. Publish the VPM package before building the listing.`);
                return;
              }
              found ||= releases.some(release => !release.draft && release.assets.some(asset =>
                asset.name.startsWith(`${manifest.name}-`) && asset.name.endsWith('.zip')));
            }
            if (!found) {
              core.setFailed('No published VPM package ZIP found. Publish the VPM package before building the listing.');
            }

      - name: Check out VPM listing tools
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ci
          clean: false

      - name: Check out VPM website templates
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/template-package-listing
          path: listing-template

      - name: Prepare website templates
        run: cp -R listing-template/Website Website

      - name: Build package listing
        run: ci/build.cmd BuildRepoListing --root ci --list-publish-directory "$GITHUB_WORKSPACE/Website"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload listing
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website

      - name: Deploy listing
        id: deployment
        uses: actions/deploy-pages@v4
